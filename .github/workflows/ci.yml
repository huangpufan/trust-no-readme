name: Audit Integrity CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  tooling-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout trust-no-readme
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tooling unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify generated indexes are in sync
        run: python3 tools/build_index.py --check

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trust-no-readme
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check immutable history & audit PR scope hygiene
        if: github.event_name == 'pull_request'
        run: |
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          SCOPE_FLAGS=""
          if echo "$LABELS" | grep -qE '(^|,)tooling(,|$)'; then
            SCOPE_FLAGS="$SCOPE_FLAGS --allow-mixed-pr"
          fi
          if echo "$LABELS" | grep -qE '(^|,)correction(,|$)'; then
            SCOPE_FLAGS="$SCOPE_FLAGS --allow-correction"
          fi
          python3 tools/validate.py --check-pr-scope "origin/${{ github.base_ref }}" $SCOPE_FLAGS

      - name: Validate schema, wording hygiene, excerpts & upstream SHA citations
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            CORE_CHANGED=$(git diff --name-only "$BASE...HEAD" -- tools/ data/schema/ .github/workflows/)
            if [ -n "$CORE_CHANGED" ]; then
              python3 tools/validate.py --verify-upstream
            else
              CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE...HEAD" -- 'audits/*/*/*/20*.md' 'audits/*/*/*/tracking.json')
              if [ -n "$CHANGED" ]; then
                # Include sibling tracking.json for any changed snapshot so cross-references stay checked
                EXTRA=""
                for f in $CHANGED; do
                  t="$(dirname "$f")/tracking.json"
                  if [ -f "$t" ]; then
                    EXTRA="$EXTRA $t"
                  fi
                done
                TARGETS=$(printf '%s\n' $CHANGED $EXTRA | sort -u)
                python3 tools/validate.py --verify-upstream $TARGETS
              else
                python3 tools/validate.py
              fi
            fi
          else
            python3 tools/validate.py --verify-upstream
          fi
