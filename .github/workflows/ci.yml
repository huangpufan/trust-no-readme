name: Audit Integrity CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trust-no-readme
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run tooling unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify generated indexes are in sync
        run: python3 tools/build_index.py --check

      - name: Check audit PR scope hygiene
        if: github.event_name == 'pull_request'
        run: |
          if echo "${{ join(github.event.pull_request.labels.*.name, ',') }}" | grep -qE '(^|,)(tooling|correction)(,|$)'; then
            echo "Skipping strict audit-only PR scope gate (labeled tooling/correction)."
          else
            python3 tools/validate.py --check-pr-scope origin/${{ github.base_ref }}
          fi

      - name: Validate schema, wording hygiene, excerpts & upstream SHA citations
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- 'audits/*/*/*/20*.md' || true)
            if [ -n "$CHANGED" ]; then
              python3 tools/validate.py --verify-upstream $CHANGED
            else
              python3 tools/validate.py
            fi
          else
            python3 tools/validate.py --verify-upstream
          fi
